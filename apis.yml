aid: abpro
name: Abpro
description: 'Abpro Holdings, Inc. is a clinical-stage biotechnology company headquartered
  in the Boston area (Woburn / Burlington, Massachusetts) that develops next-generation
  multispecific antibody therapeutics for oncology and ophthalmology. Its DiversImmune
  antibody-discovery platform and MultiMab multispecific-engineering platform are used
  to build bispecific and tetravalent T-cell-engager constructs, led by ABP-102/CT-P72,
  a tetravalent bispecific HER2 x CD3 T-cell engager partnered with Celltrion, alongside
  the ABP-110, ABP-150 and ABP-201 programs. Abpro is a drug developer rather than a
  software company: its public web surface is a corporate and investor-relations site,
  and it publishes no developer program, public API, SDK, webhook surface, or machine-readable
  specification of any kind.'
